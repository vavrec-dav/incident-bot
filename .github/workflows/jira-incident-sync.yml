name: Jira Incident Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 9-16 * * 1-5"
      timezone: "Europe/Prague"
    - cron: "0 17 * * 1-5"
      timezone: "Europe/Prague"

permissions:
  contents: write

concurrency:
  group: jira-incident-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run incident sync
        run: npm run sync
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_JQL: ${{ secrets.JIRA_JQL }}
          CACHE_STATE_FILE_PATH: state/incident-cache.json

      - name: Commit state changes
        run: |
          if git diff --quiet -- state/incident-cache.json; then
            echo "No cache changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/incident-cache.json
          git commit -m "chore: update Jira incident cache"
          git push
