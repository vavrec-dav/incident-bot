name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t local-ci-image .

  publish:
    name: Publish Docker image
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image_vars.outputs.image }}
      image_sha_tag: ${{ steps.image_vars.outputs.image_sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image variables
        id: image_vars
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "image_sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image_vars.outputs.image }}:${{ steps.image_vars.outputs.image_sha_tag }}
            ${{ steps.image_vars.outputs.image }}:latest

  deploy:
    name: Deploy to DigitalOcean droplet
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.DROPLET_APP_DIR }}
          CONTAINER_NAME: ${{ secrets.DROPLET_CONTAINER_NAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE_NAME: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_sha_tag }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_JQL: ${{ secrets.JIRA_JQL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          envs: APP_DIR,CONTAINER_NAME,GHCR_TOKEN,GHCR_USERNAME,IMAGE_NAME,IMAGE_TAG,JIRA_API_TOKEN,JIRA_BASE_URL,JIRA_EMAIL,JIRA_JQL,TEAMS_WEBHOOK_URL
          script: |
            set -eu

            mkdir -p "$APP_DIR"

            cat > "$APP_DIR/.env" <<EOF
            TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
            JIRA_BASE_URL=${JIRA_BASE_URL}
            JIRA_EMAIL=${JIRA_EMAIL}
            JIRA_API_TOKEN=${JIRA_API_TOKEN}
            EOF

            if [ -n "$JIRA_JQL" ]; then
              printf 'JIRA_JQL=%s\n' "$JIRA_JQL" >> "$APP_DIR/.env"
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE_NAME:$IMAGE_TAG"
            docker rm -f "$CONTAINER_NAME" || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              "$IMAGE_NAME:$IMAGE_TAG"
            docker image prune -f
